name: Build Windows executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build formharvester.exe
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b # v7.3.0

      - name: Install project and PyInstaller
        run: |
          uv sync --no-group dev --extra gui
          uv pip install pyinstaller

      # Build options live in the spec file, not here: the splash screen needs
      # settings the CLI does not expose.
      - name: Build executable
        run: uv run pyinstaller packaging/formharvester.spec

      # Code-sign with Azure Artifact Signing via OIDC (federated credential,
      # no client secret). The `files` path is the PyInstaller output above.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign executable
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE_NAME }}
          files: ${{ github.workspace }}\dist\formharvester.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload build artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: formharvester-windows-exe
          path: dist/formharvester.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" \
            || gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" \
                 --title "${{ github.ref_name }}" --generate-notes
          gh release upload "${{ github.ref_name }}" dist/formharvester.exe \
            --repo "${{ github.repository }}" --clobber
